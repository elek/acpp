# Sandbox fragments. A fragment may "extend" others; the "sandbox" fragment is
# the root every sandbox resolves, and the rest are selectable as profiles.
# Override any of these in ~/.config/acpp/bbwrap.yaml — a fragment defined there
# fully replaces the one here rather than merging with it.
#
# Keys: ro-bind / bind / dev-bind take "path" or "src:dest" (relative paths
# resolve against $HOME); env sets a variable outright.
#
# "pass-env" names host environment variables the sandboxed agent may inherit,
# on top of the always-applied baseline in env.go (PATH, HOME, LANG, LC_*,
# ANTHROPIC_*, proxy and CA settings, ...). Everything else is dropped, so a
# stray AWS_SECRET_ACCESS_KEY or GITHUB_TOKEN in the shell acpp was started from
# never reaches the agent. A trailing "*" is a prefix wildcard; a leading "-"
# withholds a variable the baseline would otherwise grant, and always wins.
# A profile should carry the variables its binds make useful, so the two travel
# together (see systemd, x11, docker, nvidia below). Per project, the same
# syntax goes in the comma-separated "sandbox_env" field at /project/<name>.

base:
  ro-bind:
    - /bin
    - /lib
    - /lib64
    - /usr/bin
    - /usr/lib
    - /usr/local/bin
    - /usr/local/lib
    - /usr/share/terminfo
    - /usr/share/ca-certificates
    - /usr/share/zoneinfo
    - /usr/include

etc:
  ro-bind:
    - /etc/nsswitch.conf
    - /etc/ssl/openssl.cnf
    - /etc/alternatives
    - /etc/passwd
    - /etc/group
    - /etc/resolv.conf
    - /etc/profile.d
    - /etc/bash_completion.d
    - /etc/ssl/certs
    - /etc/ca-certificates
    - /etc/ld.so.cache
    - /etc/ld.so.conf
    - /etc/ld.so.conf.d
    - /etc/localtime

# Default sandbox profile. Override or extend it in ~/.config/acpp/bbwrap.yaml.
sandbox:
  extend:
    - base
    - etc

ssh:
  ro-bind:
    - .ssh
  bind:
    - /run/user/1000/gcr/ssh
  env:
    SSH_AUTH_SOCK: /run/user/1000/gcr/ssh

systemd:
  ro-bind:
    - /run/dbus
    - /sys
  bind:
    - /run/user/1000
  pass-env:
    - XDG_RUNTIME_DIR
    - DBUS_SESSION_BUS_ADDRESS

# X11/Wayland passthrough. Opt in with --profiles x11. DISPLAY is deliberately
# not inherited by default: with no socket bound it only produces confusing
# "cannot connect to display" errors, so the vars travel with the binds that
# make them work.
x11:
  ro-bind:
    - /tmp/.X11-unix
  pass-env:
    - DISPLAY
    - WAYLAND_DISPLAY
    - XAUTHORITY

docker:
  bind:
    - /var/lib/docker
    - /var/run/docker.sock
  pass-env:
    - DOCKER_HOST

# NVIDIA GPU passthrough. Opt in with --profiles nvidia. Requires the host
# NVIDIA driver plus the listed device nodes to exist; bwrap errors if any
# listed node is missing. Override in ~/.config/acpp/bbwrap.yaml to add more
# GPUs (/dev/nvidia1, ...) or /dev/nvidia-modeset for graphics workloads.
# The userspace libraries (/usr/lib) and nvidia-smi (/usr/bin) come from base.
#
# /sys is required: NVML enumerates and validates the GPU through sysfs, so
# without it nvidia-smi fails with "GPU access blocked by the operating system"
# even though every /dev/nvidia* node is bound. (Also requires bwrap to run
# without a user namespace the driver rejects; use a setuid bwrap.)
nvidia:
  ro-bind:
    - /sys
  dev-bind:
    - /dev/nvidiactl
    - /dev/nvidia-uvm
    - /dev/nvidia-uvm-tools
    - /dev/nvidia0
  pass-env:
    - NVIDIA_VISIBLE_DEVICES
    - CUDA_VISIBLE_DEVICES
    - CUDA_HOME
